port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
ipv6: false
mode: rule
log-level: silent
allow-lan: true
external-controller: 0.0.0.0:9090
secret: ""
bind-address: "*"
unified-delay: true
profile:
  store-selected: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: redir-host
  listen: 0.0.0.0:7874
  nameserver:
    - 8.8.8.8
    - 1.0.0.1
    - https://dns.google/dns-query
  fallback:
    - 1.1.1.1
    - 8.8.4.4
    - https://cloudflare-dns.com/dns-query
    - 112.215.203.254
  default-nameserver:
    - 8.8.8.8
    - 1.1.1.1
    - 112.215.203.254
proxies:
  - name: XL-Conference 
    server: support.zoom.us
    port: 443
    type: vmess
    uuid: 90b7f668-1915-5e80-8eae-1e7f8ec3adc8
    alterId: 0
    cipher: auto
    tls: true
    skip-cert-verify: true
    servername: support.zoom.us.id-neva001.beritanect.click
    network: ws
    ws-opts:
      path: /xrayvmess
      headers:
        Host: support.zoom.us.id-neva001.beritanect.click
    udp: true
proxy-groups:
  - name: XL-AXIS
    type: select
    proxies:
      - XL-Conference 
      - DIRECT
rules:
  - MATCH,XL-AXIS
