proxy-providers:
  vpn-dari-github:
    type: http
    url: https://raw.githubusercontent.com/zanilia-13/Banjaran/refs/heads/main/Akun-Server.yaml
    path: ./proxies/akun-vpn-lokal.yaml
    interval: 3600
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
- name: Manual Select
  type: select
  use:
  - vpn-dari-github
  url: http://cp.cloudflare.com/generate_204
  interval: '30'
- name: Auto Select
  type: url-test
  use:
  - vpn-dari-github
  url: http://cp.cloudflare.com/generate_204
  interval: '30'
- name: LOAD BALANCE
  type: load-balance
  strategy: round-robin
  use:
  - vpn-dari-github
  url: http://cp.cloudflare.com/generate_204
  interval: '30'
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
ipv6: false
mode: rule
log-level: silent
allow-lan: true
external-controller: 0.0.0.0:9090
secret: ""
bind-address: "*"
unified-delay: true
profile:
  store-selected: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: redir-host
  listen: 0.0.0.0:7874
  nameserver:
    - 1.1.1.1
    - 8.8.8.8
  fallback:
    - 1.0.0.1
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
    - 112.215.203.254
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - 112.215.203.254
rules:
  - MATCH,GLOBAL 